<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="playerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213d" />
      <stop offset="100%" stop-color="#000000" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#playerGrad)" />
  <circle cx="400" cy="200" r="160" fill="#fca311" fill-opacity="0.15" />

  <!-- Player Silhouette Profile & Helmet -->
  <circle cx="400" cy="140" r="45" fill="#e5e5e5" />
  <!-- Helmet Grill -->
  <path d="M410,135 Q445,145 440,165" stroke="#14213d" stroke-width="5" fill="none" />
  <!-- Shoulders / Jersey -->
  <path d="M320,290 C340,210 460,210 480,290 Z" fill="#fca311" />
  <polygon points="400,240 380,290 420,290" fill="#ffffff" />

  <!-- Banner overlay -->
  <rect x="220" y="375" width="360" height="45" rx="22" fill="#000000" fill-opacity="0.7" />
  <text x="400" y="404" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fca311" text-anchor="middle" letter-spacing="3">PLAYER PROFILE &amp; SPOTLIGHT</text>
</svg>
