<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#061a14" />
      <stop offset="60%" stop-color="#0f382c" />
      <stop offset="100%" stop-color="#1b5e20" />
    </linearGradient>
    <radialGradient id="floodlight" cx="20%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f382c" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="floodlight2" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#fff9c4" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f382c" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Sky & Lighting -->
  <rect width="800" height="450" fill="url(#skyGrad)" />
  <circle cx="160" cy="90" r="260" fill="url(#floodlight)" />
  <circle cx="640" cy="90" r="260" fill="url(#floodlight2)" />

  <!-- Stadium Stands Silhouette -->
  <path d="M0,280 Q200,240 400,240 Q600,240 800,280 L800,450 L0,450 Z" fill="#082018" opacity="0.8" />
  <path d="M0,320 Q200,290 400,290 Q600,290 800,320 L800,450 L0,450 Z" fill="#0c2d22" />

  <!-- Cricket Ground Outfield -->
  <ellipse cx="400" cy="390" rx="360" ry="110" fill="#2e7d32" stroke="#4caf50" stroke-width="3" />
  
  <!-- Pitch -->
  <polygon points="375,320 425,320 440,430 360,430" fill="#d7ccc8" stroke="#bcaaa4" stroke-width="2" />
  <!-- Crease lines -->
  <line x1="365" y1="410" x2="435" y2="410" stroke="#ffffff" stroke-width="2" />
  <line x1="378" y1="335" x2="422" y2="335" stroke="#ffffff" stroke-width="2" />

  <!-- Stumps -->
  <rect x="394" y="390" width="3" height="20" fill="#f5f5f5" />
  <rect x="399" y="390" width="3" height="20" fill="#f5f5f5" />
  <rect x="404" y="390" width="3" height="20" fill="#f5f5f5" />
  <rect x="393" y="388" width="15" height="3" fill="#f59e0b" />

  <!-- Floodlight Towers -->
  <line x1="160" y1="40" x2="160" y2="250" stroke="#90a4ae" stroke-width="4" />
  <rect x="135" y="30" width="50" height="20" fill="#eceff1" rx="4" />
  
  <line x1="640" y1="40" x2="640" y2="250" stroke="#90a4ae" stroke-width="4" />
  <rect x="615" y="30" width="50" height="20" fill="#eceff1" rx="4" />

  <!-- Cricket Ball Silhouette with Seam -->
  <circle cx="400" cy="180" r="32" fill="#d32f2f" stroke="#b71c1c" stroke-width="3" />
  <path d="M380,165 Q400,180 420,195" stroke="#ffffff" stroke-width="3" fill="none" stroke-dasharray="4,3" />

  <!-- Title Badge -->
  <rect x="250" y="38" width="300" height="36" rx="18" fill="#000000" fill-opacity="0.4" />
  <text x="400" y="62" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f59e0b" text-anchor="middle" letter-spacing="2">CRICBAIL &bull; PRIME MATCH CENTRE</text>
</svg>
