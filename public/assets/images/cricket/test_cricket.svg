<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="testGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1b3a2b" />
      <stop offset="100%" stop-color="#0b1b13" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#testGrad)" />

  <!-- Lord's / Traditional Pavilion arches style -->
  <path d="M100,280 Q200,200 300,280 Q400,200 500,280 Q600,200 700,280 L700,450 L100,450 Z" fill="#244d39" opacity="0.4" />

  <!-- Traditional Red Cherry Ball -->
  <circle cx="400" cy="200" r="70" fill="#b71c1c" stroke="#d32f2f" stroke-width="4" />
  <path d="M350,165 Q400,200 450,235" stroke="#ffffff" stroke-width="4" fill="none" stroke-dasharray="8,5" />
  
  <!-- Wooden Cricket Bat -->
  <rect x="230" y="110" width="22" height="180" rx="6" fill="#d7ccc8" stroke="#8d6e63" stroke-width="3" transform="rotate(-35 230 110)" />
  <rect x="232" y="50" width="14" height="60" rx="3" fill="#ffffff" stroke="#8d6e63" stroke-width="2" transform="rotate(-35 230 110)" />

  <!-- Three Stumps and Bails -->
  <g transform="translate(540, 150)">
    <rect x="0" y="20" width="8" height="120" fill="#d7ccc8" rx="2" />
    <rect x="18" y="20" width="8" height="120" fill="#d7ccc8" rx="2" />
    <rect x="36" y="20" width="8" height="120" fill="#d7ccc8" rx="2" />
    <rect x="-3" y="14" width="23" height="6" fill="#ffb300" rx="2" />
    <rect x="24" y="14" width="23" height="6" fill="#ffb300" rx="2" />
  </g>

  <!-- Banner overlay -->
  <rect x="200" y="370" width="400" height="45" rx="22" fill="#000000" fill-opacity="0.5" />
  <text x="400" y="399" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="3">INTERNATIONAL TEST CRICKET</text>
</svg>
