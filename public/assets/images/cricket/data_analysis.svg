<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="anaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="100%" stop-color="#020c1b" />
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#anaGrad)" />

  <!-- Cricket Pitch Heatmap / Wagon Wheel Background Grid -->
  <circle cx="400" cy="210" r="140" fill="none" stroke="#233554" stroke-width="2" stroke-dasharray="6,4" />
  <circle cx="400" cy="210" r="80" fill="none" stroke="#233554" stroke-width="2" />
  <line x1="260" y1="210" x2="540" y2="210" stroke="#233554" stroke-width="2" />
  <line x1="400" y1="70" x2="400" y2="350" stroke="#233554" stroke-width="2" />

  <!-- Wagon wheel shot trajectories -->
  <line x1="400" y1="210" x2="490" y2="100" stroke="#64ffda" stroke-width="3" stroke-linecap="round" />
  <line x1="400" y1="210" x2="310" y2="110" stroke="#64ffda" stroke-width="3" stroke-linecap="round" />
  <line x1="400" y1="210" x2="520" y2="260" stroke="#ff5370" stroke-width="3" stroke-linecap="round" />
  <line x1="400" y1="210" x2="280" y2="280" stroke="#ffcb6b" stroke-width="3" stroke-linecap="round" />
  <line x1="400" y1="210" x2="410" y2="75" stroke="#82aaff" stroke-width="4" stroke-linecap="round" />

  <!-- Centre Pitch Node -->
  <circle cx="400" cy="210" r="10" fill="#64ffda" />

  <!-- Banner overlay -->
  <rect x="220" y="375" width="360" height="45" rx="22" fill="#000000" fill-opacity="0.7" />
  <text x="400" y="404" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#64ffda" text-anchor="middle" letter-spacing="3">TACTICAL &amp; DATA ANALYSIS</text>
</svg>
